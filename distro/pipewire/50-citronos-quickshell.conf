# CitronOS: no realtime scheduling (libpipewire-module-rt) in Quickshell, which
# runs the shell, the lock screen and CitronOS's apps. They watch PipeWire
# (volume, devices) from their main thread; none has an audio thread that
# needs realtime.
#
# Why: with no RTKit to answer, module-rt can set the process's realtime
# run-time limit (RLIMIT_RTTIME) to 0, and the kernel then kills any thread of
# it that is realtime for a single tick: the boot test caught the shell killed
# that way ("RT Watchdog Timeout (hard): qs[…]", distro/archiso/boot-test.sh).
#
# Installed in /usr/share/pipewire/client.conf.d by citronos-runtime
# (scripts/stage.sh); PipeWire reads it for every client, and the rule only
# matches Quickshell's process.
context.properties.rules = [
    {   matches = [ { application.process.binary = "qs" } ]
        actions = {
            update-props = {
                module.rt = false
            }
        }
    }
]
