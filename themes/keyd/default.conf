# CitronOS: ⌘ shortcuts everywhere.
# Super (⌘) + a letter becomes Ctrl + that letter for apps, so ⌘C/⌘V/⌘Z/⌘S/⌘W/⌘Q
# work like on a Mac in GTK, Qt, Electron and browser apps. Keys not listed here
# (Space, Tab, M, H, comma, the number row…) stay on Super for Hyprland's own
# shortcuts: Spotlight, the app switcher, minimise, hide, Settings, screenshots.
# Terminals get Ctrl+Shift instead via /etc/keyd/app.conf (keyd-application-mapper).
[ids]
*

[main]
# Caps Lock acts as Control when held, Escape when tapped.
capslock = overload(control, esc)

[meta]
a = C-a
b = C-b
c = C-c
d = C-d
f = C-f
g = C-g
i = C-i
k = C-k
l = C-l
n = C-n
o = C-o
p = C-p
q = C-q
r = C-r
s = C-s
t = C-t
u = C-u
v = C-v
w = C-w
x = C-x
y = C-y
z = C-z
equal = C-equal
minus = C-minus
0 = C-0
left = home
right = end
up = C-home
down = C-end
backspace = C-backspace
leftbrace = A-left
rightbrace = A-right

# ⌃⌘Q (Lock Screen) and ⌃⌘F (Enter Full Screen) stay Super shortcuts for Hyprland.
[control+meta]
q = C-M-q
f = C-M-f

[meta+shift]
z = C-S-z
t = C-S-t
n = C-S-n
