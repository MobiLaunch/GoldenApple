# Per-app overrides for keyd-application-mapper (runs in the Hyprland session).
# In terminals ⌘C/⌘V copy and paste (Ctrl+Shift+C/V) instead of sending Ctrl+C.
# Section names are window classes; check yours with `keyd-application-mapper -v`.
