<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Golden Gate typography: Inter everywhere, rendered the way the design expects:
     grayscale antialiasing, no subpixel colour fringes, light hinting. -->
<fontconfig>
  <!-- UI font. Apps that ask for the platform font names get Inter too. -->
  <alias binding="strong"><family>sans-serif</family><prefer><family>Inter Variable</family><family>Inter</family></prefer></alias>
  <alias binding="strong"><family>system-ui</family><prefer><family>Inter Variable</family><family>Inter</family></prefer></alias>
  <alias binding="strong"><family>-apple-system</family><prefer><family>Inter Variable</family></prefer></alias>
  <alias binding="strong"><family>BlinkMacSystemFont</family><prefer><family>Inter Variable</family></prefer></alias>
  <alias binding="strong"><family>SF Pro Text</family><prefer><family>Inter Variable</family></prefer></alias>
  <alias binding="strong"><family>SF Pro Display</family><prefer><family>Inter Variable</family></prefer></alias>
  <alias binding="strong"><family>Helvetica Neue</family><prefer><family>Inter Variable</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>JetBrains Mono</family></prefer></alias>
  <alias binding="strong"><family>ui-monospace</family><prefer><family>JetBrains Mono</family></prefer></alias>
  <alias binding="strong"><family>SF Mono</family><prefer><family>JetBrains Mono</family></prefer></alias>

  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
  </match>

  <!-- Inter's display-friendly alternates: open digits, single-storey forms off. -->
  <match target="font">
    <test name="family" compare="contains"><string>Inter</string></test>
    <edit name="fontfeatures" mode="append">
      <string>cv05 on</string><string>cv08 on</string><string>ss03 on</string>
    </edit>
  </match>
</fontconfig>
