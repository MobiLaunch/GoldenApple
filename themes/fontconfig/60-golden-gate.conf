<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- CitronOS typography: prefer SF Pro/SF Mono when locally installed, with
     Inter/JetBrains Mono as redistributable fallbacks. Apple font binaries are
     intentionally not shipped by this repository. -->
<fontconfig>
  <!-- UI font. If SF Pro is present it wins; otherwise the ISO stays fully usable. -->
  <alias binding="strong"><family>sans-serif</family><prefer><family>SF Pro Text</family><family>Inter Variable</family><family>Inter</family></prefer></alias>
  <alias binding="strong"><family>system-ui</family><prefer><family>SF Pro Text</family><family>Inter Variable</family><family>Inter</family></prefer></alias>
  <alias binding="strong"><family>-apple-system</family><prefer><family>SF Pro Text</family><family>Inter Variable</family></prefer></alias>
  <alias binding="strong"><family>BlinkMacSystemFont</family><prefer><family>SF Pro Text</family><family>Inter Variable</family></prefer></alias>
  <alias binding="strong"><family>Helvetica Neue</family><prefer><family>SF Pro Text</family><family>Inter Variable</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>SF Mono</family><family>JetBrains Mono</family></prefer></alias>
  <alias binding="strong"><family>ui-monospace</family><prefer><family>SF Mono</family><family>JetBrains Mono</family></prefer></alias>

  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
  </match>

  <!-- Inter's display-friendly alternates: open digits, single-storey forms off. -->
  <match target="font">
    <test name="family" compare="contains"><string>Inter</string></test>
    <edit name="fontfeatures" mode="append">
      <string>cv05 on</string><string>cv08 on</string><string>ss03 on</string>
    </edit>
  </match>
</fontconfig>
