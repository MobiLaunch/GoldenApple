// Golden Gate: Firefox as Safari (autoconfig; the first line must be a comment).
// Defaults only: anything you change in about:config or Settings wins.
defaultPref("toolkit.legacyUserProfileCustomizations.stylesheets", true);
// Tabs in the sidebar; the toolbar is the title bar, with the traffic lights.
defaultPref("sidebar.revamp", true);
defaultPref("sidebar.verticalTabs", true);
defaultPref("sidebar.visibility", "always-show");
defaultPref("sidebar.main.tools", "history,bookmarks");
defaultPref("browser.tabs.inTitlebar", 1);
defaultPref("browser.uidensity", 0);
defaultPref("browser.toolbars.bookmarks.visibility", "never");
defaultPref("widget.gtk.rounded-bottom-corners.enabled", true);
defaultPref("widget.gtk.overlay-scrollbars.enabled", true);
defaultPref("browser.theme.native-theme", true);
// Follow the system appearance (light, dark, auto) for the browser and pages.
defaultPref("layout.css.prefers-color-scheme.content-override", 2);
// No first-run tour, default-browser nag or sponsored tiles.
defaultPref("browser.aboutwelcome.enabled", false);
defaultPref("browser.shell.checkDefaultBrowser", false);
defaultPref("browser.newtabpage.activity-stream.showSponsored", false);
defaultPref("browser.newtabpage.activity-stream.showSponsoredTopSites", false);
defaultPref("browser.newtabpage.activity-stream.feeds.section.topstories", false);
defaultPref("sidebar.verticalTabs.dragToPinPromo.dismissed", true);
defaultPref("datareporting.policy.firstRunURL", "");
defaultPref("datareporting.policy.dataSubmissionPolicyBypassNotification", true);
defaultPref("browser.startup.homepage_override.mstone", "ignore");
defaultPref("browser.newtabpage.activity-stream.asrouter.userprefs.cfr.addons", false);
defaultPref("browser.newtabpage.activity-stream.asrouter.userprefs.cfr.features", false);
defaultPref("font.name.sans-serif.x-western", "Inter Variable");
defaultPref("font.name.monospace.x-western", "JetBrains Mono");

// GG_FIREFOX_DEBUG=1: print the browser window's layout (the CI screenshot job
// uses it to check the stylesheet's selectors against this Firefox's DOM).
try {
  const env = Components.classes["@mozilla.org/process/environment;1"].getService(Components.interfaces.nsIEnvironment);
  if (env.get("GG_FIREFOX_DEBUG")) {
    pref("browser.dom.window.dump.enabled", true);
    const obs = Components.classes["@mozilla.org/observer-service;1"].getService(Components.interfaces.nsIObserverService);
    obs.addObserver({ observe(win) {
      const d = win.document, out = [];
      const desc = (e) => {
        const cs = win.getComputedStyle(e), r = e.getBoundingClientRect();
        return `${e.localName}#${e.id}.${String(e.className).replace(/ /g, ".")} display=${cs.display} margin=${cs.margin} radius=${cs.borderRadius} bg=${cs.backgroundColor} rect=${Math.round(r.x)},${Math.round(r.y)},${Math.round(r.width)}x${Math.round(r.height)}`;
      };
      const walk = (e, depth) => { if (depth > 3) return; out.push("  ".repeat(depth) + desc(e)); for (const c of e.children) walk(c, depth + 1); };
      const b = d.getElementById("browser"); if (b) walk(b, 0);
      const nav = d.getElementById("nav-bar"); if (nav) walk(nav, 0);
      dump("GG-DEBUG begin\n" + out.join("\n") + "\nGG-DEBUG end\n");
    } }, "browser-delayed-startup-finished");
  }
} catch (e) {}

// The Safari look, for every window, without a userChrome.css in the profile.
try {
  const sss = Components.classes["@mozilla.org/content/style-sheet-service;1"]
    .getService(Components.interfaces.nsIStyleSheetService);
  const io = Components.classes["@mozilla.org/network/io-service;1"]
    .getService(Components.interfaces.nsIIOService);
  const dir = Components.classes["@mozilla.org/file/directory_service;1"]
    .getService(Components.interfaces.nsIProperties).get("GreD", Components.interfaces.nsIFile);
  dir.append("golden-gate");
  dir.append("golden-gate.css");
  const uri = io.newFileURI(dir);
  if (dir.exists() && !sss.sheetRegistered(uri, sss.USER_SHEET)) sss.loadAndRegisterSheet(uri, sss.USER_SHEET);
} catch (e) {
  Components.utils.reportError("Golden Gate: could not load the Safari style: " + e);
}
