# Golden Gate: Hyprland configuration.
# Targets Hyprland 0.48 – 0.52 syntax (unified `windowrule`, `decoration:shadow`).
# Motion, blur and rounding come from the design tokens:
source = ~/.config/hypr/golden-gate/motion.conf          # generated: design/dist/hyprland-motion.conf

# ------------------------------------------------------------------ session
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,gtk3
env = QS_ICON_THEME,GoldenGate
env = GTK_THEME,Adwaita                                   # libadwaita + our gtk.css overrides
# Wallpaper path for the shell (menu-bar tone, lock screen); filled in by scripts/install.sh
env = GG_WALLPAPER,__GG_WALLPAPER__

exec-once = gsettings set org.gnome.desktop.interface icon-theme GoldenGate
exec-once = gsettings set org.gnome.desktop.interface font-name "Inter Variable 10.5"
exec-once = gsettings set org.gnome.desktop.interface document-font-name "Inter Variable 10.5"
exec-once = gsettings set org.gnome.desktop.interface monospace-font-name "JetBrains Mono 10"
exec-once = gsettings set org.gnome.desktop.wm.preferences button-layout "close,minimize,maximize:"
exec-once = hyprpaper    # ~/.config/hypr/hyprpaper.conf points at the Golden Gate wallpaper
exec-once = qs -c golden-gate
exec-once = keyd-application-mapper -d   # per-app ⌘ overrides (terminals); needs the keyd group
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = hypridle

# ------------------------------------------------------------------ look
general {
    gaps_in = 6
    gaps_out = 10
    border_size = 0
    layout = dwindle
    resize_on_border = true
    extend_border_grab_area = 12
}

decoration {
    # 2.0 draws circular corners; higher values approach the continuous
    # "squircle" corner used by the design system.
    rounding_power = 3.4
    active_opacity = 1.0
    inactive_opacity = 1.0
    dim_inactive = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = 0x0b1f4f
    focus_on_activate = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = false
}

cursor {
    no_warps = true
}

input {
    kb_layout = us
    follow_mouse = 2                      # focus follows click, like a desktop
    natural_scroll = true
    touchpad {
        natural_scroll = true
        tap-to-click = true
        clickfinger_behavior = true      # two-finger click = secondary click
        scroll_factor = 0.6
    }
}

# Three-finger swipe between Spaces. Hyprland 0.51 replaced workspace_swipe with
# the `gesture` keyword; use whichever your version supports.
# gesture = 3, horizontal, workspace

# ------------------------------------------------------------------ windows
# A desktop, not a tiler: every window floats and opens centred.
windowrule = float, class:.*
windowrule = center, class:.*

# ------------------------------------------------------------------ shell surfaces
# Blur behind the Quickshell layers. ignorealpha keeps the blur to the painted
# glass shapes instead of the whole transparent layer rectangle.
layerrule = blur, ^gg-(dock|controlcenter|spotlight|menubar)$
layerrule = ignorealpha 0.05, ^gg-(dock|controlcenter|spotlight)$
layerrule = ignorealpha 0.5, ^gg-menubar$
layerrule = animation popin 90%, ^gg-(controlcenter|spotlight)$
layerrule = animation slide bottom, ^gg-dock$
layerrule = blur, ^notifications$
layerrule = ignorealpha 0.1, ^notifications$

# ------------------------------------------------------------------ keys
# SUPER plays the role of ⌘. keyd (themes/keyd/default.conf) turns ⌘+letter into
# Ctrl+letter for apps, so ⌘C/⌘V/⌘W/⌘Q behave like on a Mac. Hyprland keeps the
# keys keyd leaves alone: Space, Tab, M, H, comma, Escape, Return and the number row.
$mod = SUPER
$qs = qs -c golden-gate ipc call
bind = $mod, SPACE, exec, $qs spotlight toggle
bind = $mod, TAB, global, golden-gate:switcher-next
bind = $mod SHIFT, TAB, global, golden-gate:switcher-prev
bindr = $mod, SUPER_L, global, golden-gate:switcher-commit
bind = $mod, M, movetoworkspacesilent, special:minimized
bind = $mod SHIFT, M, togglespecialworkspace, minimized
bind = $mod, H, movetoworkspacesilent, special:hidden
bind = $mod, comma, exec, gnome-control-center
bind = $mod, RETURN, exec, ghostty
bind = $mod ALT, ESCAPE, exec, hyprctl kill                 # Force Quit (⌥⌘⎋)
bind = $mod CTRL, Q, exec, $qs lock lock                    # Lock Screen (⌃⌘Q, passed through by keyd)
bind = $mod ALT, C, exec, $qs controlcenter toggle
bind = $mod ALT, N, exec, $qs notifications toggleDnd
bind = $mod SHIFT, 3, exec, grim ~/Pictures/Screenshot-$(date +%F-%H%M%S).png
bind = $mod SHIFT, 4, exec, grim -g "$(slurp)" ~/Pictures/Screenshot-$(date +%F-%H%M%S).png
bind = $mod SHIFT, 5, exec, grim -g "$(slurp)" - | wl-copy
bind = CTRL, left, workspace, e-1
bind = CTRL, right, workspace, e+1
bind = $mod ALT, F, fullscreen, 1
# Mission Control: bind CTRL+up once an overview plugin (hyprexpo) is installed.

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Media / brightness keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl -q set 6%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -q set 6%-
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous
