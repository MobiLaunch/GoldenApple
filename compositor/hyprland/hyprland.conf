# CitronOS: Hyprland configuration.
# Targets Hyprland 0.53+ syntax (the ISO ships 0.56; its boot test fails on any config error).
# Motion, blur and rounding come from the design tokens:
source = ~/.config/hypr/golden-gate/motion.conf          # generated: design/dist/hyprland-motion.conf

# ------------------------------------------------------------------ session
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,gtk3
env = QS_ICON_THEME,GoldenGate
# No GTK_THEME: when it is set, libadwaita skips its own stylesheet, so GNOME apps
# lose dark mode, accent colours and the CitronOS theme (~/.config/gtk-4.0/gtk.css).
# Wallpaper path for the shell (menu-bar tone, lock screen); filled in by scripts/install.sh
env = GG_WALLPAPER,__GG_WALLPAPER__        # drawn by the shell (Wallpaper.qml), also the lock screen

exec-once = gsettings set org.gnome.desktop.interface icon-theme GoldenGate
exec-once = gsettings set org.gnome.desktop.interface font-name "Golden Gate UI 10"
exec-once = gsettings set org.gnome.desktop.interface document-font-name "Golden Gate UI 10"
exec-once = gsettings set org.gnome.desktop.interface monospace-font-name "Golden Gate Mono 10"
exec-once = gsettings set org.gnome.desktop.wm.preferences button-layout "close,minimize,maximize:"
# Load HyprGlass and restore persistent display/material settings before shell
# layers are created, preventing a visible material swap on the first frame.
# Export the compositor environment after Wayland exists so portals,
# Flatpak applications and D-Bus activated services attach to this session.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP XDG_DATA_DIRS
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP XDG_DATA_DIRS
exec-once = sh -c 'gnome-keyring-daemon --start --components=secrets >/dev/null 2>&1 || true'

exec-once = gg-apply-preferences
# Read package/Flatpak desktop changes via inotify, acquire GPL-licensed
# WhiteSur artwork asynchronously and publish Launchpad's approved icon list.
# No extra polling inside Quickshell's animation/render loop.
exec-once = sh -c 'command -v gg-icon-resolver >/dev/null 2>&1 && gg-icon-resolver watch >>"$HOME/.local/state/golden-gate-icon-resolver.log" 2>&1'
# XDG Login Items: only configured apps that apply to this desktop start.
# dex honours Hidden, OnlyShowIn, TryExec and per-user overrides; run at
# startup only, never on a Hyprland config reload.
exec-once = sh -c 'command -v dex >/dev/null 2>&1 && dex --autostart --environment Hyprland'
# A config reload resets what the plugins were told at runtime (the glass, the
# title bars' look and buttons): `exec` runs on every load, so set them again.
exec = gg-hyprglass-sync
# Hyprland owns the Wayland display, so start exactly one shell after the compositor is ready.
# The shell, restarted if it stops. Its log ($1) is kept under 4 MB (the last
# one stays as .old), and a missing ~/.local/state (a new account) is made:
# without it the redirect failed and the shell never started. Only positional
# names inside: Hyprland would take $words for its own variables.
exec-once = sh -c 'mkdir -p "${1%/*}"; while :; do [ "$(stat -c %s "$1" 2>/dev/null || echo 0)" -gt 4000000 ] && mv -f "$1" "$1.old"; if touch "$1" 2>/dev/null; then qs -c golden-gate >>"$1" 2>&1; else qs -c golden-gate; fi; logger -t gg-shell "Quickshell exited; restarting in 2s"; sleep 2; done' sh "$HOME/.local/state/golden-gate-shell.log"
exec-once = keyd-application-mapper -d   # per-app ⌘ overrides (terminals); needs the keyd group
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = hypridle
# AirDrop: be found by, and receive from, devices nearby. Started again if it
# stops; while another copy runs (the AirDrop window starts one if needed),
# this one steps aside and looks again in 30 seconds.
exec-once = sh -c 'while :; do python3 __GG_APPS__/airdrop/airdropd.py serve; sleep 30; done'
# AirPlay Receiver, when it's on: Hyprland started from a tty never reaches
# graphical-session.target, so the enabled user service is started here.
exec-once = systemctl --user -q is-enabled gg-airplay.service && systemctl --user start gg-airplay.service
exec-once = sh ~/.config/hypr/golden-gate/report-config-errors.sh   # config problems in the journal
exec-once = logger -t golden-gate "session started"   # boot tests wait for this
# Setup Assistant, once: until ~/.config/golden-gate/setup-done exists (gg.nosetup on
# the kernel command line skips it, for tests).
exec-once = [ -e ~/.config/golden-gate/setup-done ] || grep -qw gg.nosetup /proc/cmdline || qs -n -p __GG_APPS__/setup.qml
# Offers a report when an app crashes, if you chose to share them in Setup Assistant.
exec-once = bash __GG_APPS__/setup/crash-watch.sh

# ------------------------------------------------------------------ look
# Liquid Glass (docs/LIQUID-GLASS.md). The values here are the defaults;
# gg-hyprglass-sync sets them again for the theme and for the Glass and
# Reduce Transparency settings, on every load.
general {
    gaps_in = 8
    gaps_out = 16
    # A specular rim: a 1 px edge lit from the top left, as glass catches light.
    border_size = 1
    col.active_border = rgba(ffffff66) rgba(ffffff11) 45deg
    col.inactive_border = rgba(ffffff22) rgba(00000011) 45deg
    layout = dwindle
    resize_on_border = true
    extend_border_grab_area = 12
    # Native Hyprland snapping, evaluated during drag/resize (no polling,
    # overlay surface or fake window texture). This attracts floating windows
    # to each other and to monitor edges while respecting the visual gaps.
    snap {
        enabled = true
        window_gap = 12
        monitor_gap = 12
        border_overlap = false
        respect_gaps = true
    }
}

decoration {
    # 2.0 draws circular corners; higher values approach the continuous
    # "squircle" corner used by the design system.
    rounding_power = 3.4
    # Window contents are solid, in front or not: the glass is in their
    # sidebars and toolbars (drawn see-through by the app) and the shell.
    active_opacity = 1.0
    inactive_opacity = 1.0
    dim_inactive = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = 0x0b1f4f
    focus_on_activate = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = false
}

cursor {
    no_warps = true
}

input {
    kb_layout = us
    follow_mouse = 2                      # focus follows click, like a desktop
    natural_scroll = true
    touchpad {
        natural_scroll = true
        tap-to-click = true
        clickfinger_behavior = true      # two-finger click = secondary click
        scroll_factor = 0.6
    }
}

# Trackpad, as on a Mac: three (or four) fingers left and right move between
# desktops, up opens Mission Control, down App Exposé.
gesture = 3, horizontal, workspace
gesture = 4, horizontal, workspace
gesture = 3, up, dispatcher, exec, qs -c golden-gate ipc call missioncontrol toggle
gesture = 4, up, dispatcher, exec, qs -c golden-gate ipc call missioncontrol toggle
gesture = 3, down, dispatcher, exec, qs -c golden-gate ipc call missioncontrol appExpose
gesture = 4, down, dispatcher, exec, qs -c golden-gate ipc call missioncontrol appExpose

# ------------------------------------------------------------------ windows
# Rules use the Hyprland 0.53+ syntax: comma-separated "key value" fields, with
# match:<property> <regex> selecting windows or layers.
# A desktop, not a tiler: float every app and center its frame in the
# usable desktop. The 28px upward bias compensates for the Dock reserving more
# space than the top menu bar; keep it in sync with apps/lib/WindowGeometry.js.
# These monitor-local expressions also work on secondary / scaled displays.
# Do not force a common window SIZE: each app keeps its preferred dimensions,
# bounded at source by its own maximumSize / maximumHeight.
windowrule = match:class .*, float on, move ((monitor_w-window_w)*0.5) ((monitor_h-window_h)*0.5-28)
# Liquid Glass per app (docs/LIQUID-GLASS.md): terminals a little clearer,
# as a Terminal profile can be (Reduce Transparency makes them solid too).
windowrule = match:class ^(com\.mitchellh\.ghostty|kitty|foot|Alacritty)$, opacity 0.97 0.96
# Never see-through: full-screen windows, video and games, so nothing behind
# them shows through the picture.
windowrule = match:fullscreen 1, opaque on
windowrule = match:content ^(video|game)$, opaque on

# ------------------------------------------------------------------ shell surfaces
# HyprGlass owns blur/refraction for CitronOS's glass layer surfaces. Do not
# also enable Hyprland blur here: two backdrop pipelines make the material muddy
# and can hide HyprGlass on cached/static frames.
# These surfaces animate their content in QML. A second compositor popin
# scales the whole desktop, softens text and fights the content animation.
layerrule = match:namespace ^gg-(controlcenter|spotlight|applications)$, no_anim on
layerrule = match:namespace ^gg-dock$, animation slide bottom
# The desktop picture and the menu bar are simply there at login, like on a Mac:
# layersIn above would zoom the whole screen in from 90%.
layerrule = match:namespace ^gg-wallpaper$, no_anim on
# The app-launch card (shell/AppLaunch.qml) animates itself.
layerrule = match:namespace ^gg-launch$, no_anim on
layerrule = match:namespace ^gg-nearby$, no_anim on   # the pairing card rises by itself
layerrule = match:namespace ^gg-widgets$, no_anim on            # widgets and their gallery animate themselves
layerrule = match:namespace ^gg-widget-gallery$, no_anim on
layerrule = match:namespace ^gg-missioncontrol$, no_anim on   # the windows fly into place by themselves
layerrule = match:namespace ^gg-menubar$, animation fade
# No compositor blur on the shell's menus (no blur_popups): it covers a popup's
# whole surface, and a shell menu's surface is bigger than the menu (room for
# its shadow and submenus), so the blur showed as a box round every menu.
# Their own glass bends what's behind them (Glass.qml, DesktopBackdrop).
# decoration:blur:popups still covers windows' own menus.

# ------------------------------------------------------------------ keys
# SUPER plays the role of ⌘. keyd (themes/keyd/default.conf) turns ⌘+letter into
# Ctrl+letter for apps, so ⌘C/⌘V/⌘W/⌘Q behave like on a Mac. Hyprland keeps the
# keys keyd leaves alone: Space, Tab, M, H, comma, Escape, Return and the number row.
$mod = SUPER
$qs = qs -c golden-gate ipc call
bind = $mod, SPACE, exec, $qs spotlight toggle
bind = $mod SHIFT, SPACE, exec, gg-intelligence --voice     # Citron voice bubble (⇧⌘Space)
bind = $mod, TAB, global, golden-gate:switcher-next
bind = $mod SHIFT, TAB, global, golden-gate:switcher-prev
bindr = $mod, SUPER_L, global, golden-gate:switcher-commit
bind = $mod, M, movetoworkspacesilent, special:minimized
bind = $mod SHIFT, M, togglespecialworkspace, minimized
bind = $mod, H, movetoworkspacesilent, special:hidden
bind = $mod ALT, H, exec, $qs menubar hideOthers                # Hide Others (⌥⌘H)
bind = $mod, comma, exec, gg-settings
bind = $mod, RETURN, exec, ghostty
bind = $mod ALT, ESCAPE, exec, hyprctl kill                 # Force Quit (⌥⌘⎋)
bind = $mod CTRL, Q, exec, $qs lock lock                    # Lock Screen (⌃⌘Q, passed through by keyd)
bind = $mod SHIFT, Q, exec, $qs session ask logout          # Log Out… (⇧⌘Q), asks first
bind = $mod ALT, C, exec, $qs controlcenter toggle
bind = , XF86LaunchB, exec, $qs launchpad toggle             # Launchpad key (F4 on Apple keyboards)
bind = , F4, exec, $qs launchpad toggle
bind = $mod ALT, N, exec, $qs notifications toggleDnd
# Screenshots as on the Mac (shell/Screenshot.qml): ⇧⌘3 the screen, ⇧⌘4 a part
# of it (Space: a window), ⇧⌘5 the toolbar with recording; add ⌃ for the clipboard.
bind = $mod SHIFT, 3, exec, $qs screenshot screen
bind = $mod SHIFT, 4, exec, $qs screenshot area
bind = $mod SHIFT, 5, exec, $qs screenshot toolbar
bind = $mod CTRL SHIFT, 3, exec, $qs screenshot screenToClipboard
bind = $mod CTRL SHIFT, 4, exec, $qs screenshot areaToClipboard
bind = CTRL, left, workspace, e-1
bind = CTRL, right, workspace, e+1
bind = $mod ALT, F, fullscreen, 1                         # Zoom (⌥⌘F)
bind = $mod CTRL, F, fullscreen, 0                        # Enter Full Screen (⌃⌘F, passed through by keyd)
# Window › Move & Resize (gg-tile), with Rectangle's ⌃⌥ keys: halves on the
# arrows, quarters on U I J K, Fill on Return, Center on C, back on Backspace.
bind = CTRL ALT, left, exec, gg-tile left
bind = CTRL ALT, right, exec, gg-tile right
bind = CTRL ALT, up, exec, gg-tile top
bind = CTRL ALT, down, exec, gg-tile bottom
bind = CTRL ALT, U, exec, gg-tile top-left
bind = CTRL ALT, I, exec, gg-tile top-right
bind = CTRL ALT, J, exec, gg-tile bottom-left
bind = CTRL ALT, K, exec, gg-tile bottom-right
bind = CTRL ALT, RETURN, exec, gg-tile fill
bind = CTRL ALT, C, exec, gg-tile center
bind = CTRL ALT, BACKSPACE, exec, gg-tile restore
bind = CTRL, up, exec, $qs missioncontrol toggle           # Mission Control (⌃↑)
bind = CTRL, down, exec, $qs missioncontrol appExpose      # App Exposé (⌃↓)
bind = , XF86LaunchA, exec, $qs missioncontrol toggle      # Mission Control key (F3 on Apple keyboards)
bind = , F3, exec, $qs missioncontrol toggle

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Media / brightness keys
# The keys change the level themselves, then the shell shows its indicator.
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+; $qs osd volume
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-; $qs osd volume
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle; $qs osd volume
bindel = , XF86MonBrightnessUp, exec, brightnessctl -q set 6%+; $qs osd brightness
bindel = , XF86MonBrightnessDown, exec, brightnessctl -q set 6%-; $qs osd brightness
# CitronOS Music has no MPRIS yet: it takes the keys when no MPRIS player does.
$music = qs -p __GG_APPS__/music.qml ipc call music
bindl  = , XF86AudioPlay, exec, playerctl play-pause || $music toggle
bindl  = , XF86AudioNext, exec, playerctl next || $music next
bindl  = , XF86AudioPrev, exec, playerctl previous || $music previous

# ------------------------------------------------------------------ this machine
# Screen scale in virtual machines and lighter effects without a GPU. Generated by
# golden-gate/machine-conf.sh; last, so it overrides the settings above.
source = ~/.config/hypr/golden-gate/input.conf     # keyboard and trackpad, from Setup Assistant and Settings
source = ~/.config/hypr/golden-gate/accessibility.conf   # Settings › Accessibility
source = ~/.config/hypr/golden-gate/windows.conf   # Settings › Desktop & Dock: snapping and border resize
source = ~/.config/hypr/golden-gate/machine.conf
source = ~/.config/hypr/golden-gate/displays.conf  # after machine.conf: your choice wins. Settings › Displays (resolution, scale)
