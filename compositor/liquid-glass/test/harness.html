<!doctype html><meta charset=utf-8><body style="margin:0;background:#000"><canvas id=c width=1440 height=900></canvas>
<script>
// Renders glass shapes with a candidate fragment shader over a blurred backdrop,
// the way a compositor pass would: sharp screen outside, shader inside.
const VS = `attribute vec2 pos; varying vec2 v_texcoord;
void main(){ v_texcoord = pos * 0.5 + 0.5; v_texcoord.y = 1.0 - v_texcoord.y; gl_Position = vec4(pos, 0.0, 1.0); }`;
window.render = async (fragSrc, shapes, opts = {}) => {
  const c = document.getElementById("c"), gl = c.getContext("webgl", { premultipliedAlpha: true, preserveDrawingBuffer: true });
  const img = new Image(); img.src = "backdrop.jpg"; await img.decode();
  const W = c.width, H = c.height;
  const mk = (filter) => { const cv = document.createElement("canvas"); cv.width = W; cv.height = H; const x = cv.getContext("2d"); x.filter = filter; x.drawImage(img, 0, 0, W, H); return cv; };
  const sharp = mk("none"), blurred = mk(`blur(${opts.blur ?? 18}px) saturate(1.8)`);
  const tex = (src) => { const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
    for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v); return t; };
  const compile = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const prog = (fs) => { const p = gl.createProgram(); gl.attachShader(p, compile(gl.VERTEX_SHADER, VS)); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p)); return p; };
  const copyFS = `precision mediump float; varying vec2 v_texcoord; uniform sampler2D tex; void main(){ gl_FragColor = texture2D(tex, v_texcoord); }`;
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const draw = (p) => { const loc = gl.getAttribLocation(p, "pos"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); };
  let glass;
  try { glass = prog(fragSrc); } catch (e) { return { error: String(e.message) }; }
  const copy = prog(copyFS);
  gl.viewport(0, 0, W, H); gl.disable(gl.BLEND);
  gl.useProgram(copy); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex(sharp)); gl.uniform1i(gl.getUniformLocation(copy, "tex"), 0); draw(copy);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(glass); gl.bindTexture(gl.TEXTURE_2D, tex(blurred));
  const u = (n) => gl.getUniformLocation(glass, n);
  gl.uniform1i(u("tex"), 0); gl.uniform2f(u("screenSize"), W, H);
  for (const s of shapes) {
    gl.uniform4f(u("surfaceRect"), ...s.rect); gl.uniform1f(u("radius"), s.radius); gl.uniform1f(u("bezel"), s.bezel ?? 14); gl.uniform1f(u("strength"), s.strength ?? 14);
    const l = Math.hypot(1, 1); gl.uniform2f(u("lightDir"), 1 / l, 1 / l); gl.uniform4f(u("tint"), ...(s.tint ?? [0.12, 0.12, 0.12, 0.12]));
    draw(glass);
  }
  return { error: null };
};
</script>
