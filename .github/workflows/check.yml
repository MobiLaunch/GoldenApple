name: Check

on:
  push:
  pull_request:

jobs:
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - name: Rebuild tokens and icons
        run: npm run build
      - name: Generated files are up to date
        run: git diff --exit-code
      - name: Lint shell scripts
        run: find scripts distro apps themes compositor -type f -name "*.sh" -print0 | xargs -0 -n1 bash -n
      - name: Guard the login and glass paths
        run: |
          grep -q 'id: applicationsPanel' shell/shell.qml
          grep -q 'DesktopEntries.applications.values' shell/Applications.qml
          ! grep -q 'Quickshell.Services.DesktopEntries' shell/Applications.qml
          ! grep -q 'applicationsOpenRetry' shell/Dock.qml
          grep -q 'apps@accent.svg' shell/Dock.qml
          ! grep -q 'dockMagnification' shell/Dock.qml
          ! grep -q 'dockMagnifiedSize' shell/Dock.qml
          ! grep -q 'pointerTargetX' shell/Dock.qml
          grep -q 'iPad-style glass shelf' shell/Dock.qml
          grep -q 'DesktopWidgets { id: desktopWidgets' shell/shell.qml
          grep -q 'golden-gate-shell.log' distro/archiso/overlay/usr/local/bin/gg-session
          ! grep -q 'qs -c' distro/archiso/overlay/usr/local/bin/gg-session
          grep -q 'qs -c golden-gate' compositor/hyprland/hyprland.conf
          grep -q 'gg-apply-preferences' compositor/hyprland/hyprland.conf
          grep -q 'systemd-detect-virt --vm' compositor/hyprland/hyprglass-sync.sh
          grep -q 'glass_opacity 0.48' compositor/hyprland/hyprglass-sync.sh
          grep -q 'id: panel' shell/ControlCenter.qml
          grep -q 'Qt.RightButton' shell/Wallpaper.qml
          grep -q 'Qt.RightButton' shell/Dock.qml
          grep -q 'Qt.RightButton' shell/Applications.qml
          grep -q 'onContextMenuRequested' apps/browser/Browser.qml
          grep -q 'menu.popup' apps/files.qml
          grep -q 'id: nowPlaying' shell/ControlCenter.qml
          grep -q 'role: "dock"' shell/Dock.qml
          grep -q 'dark ? "#7021262e" : "#5f343941"' apps/lib/theme/Theme.qml
          grep -q 'GG_WEB_LIVE_SAFE=1' apps/browser/launch.sh
          grep -q -- '--disable-gpu' apps/browser/launch.sh
          grep -q 'rendererRestarts' apps/browser/Browser.qml
          grep -q 'visible: pane.joining === networkBlock.modelData.ssid' apps/settings/panes/WifiPane.qml
          grep -q 'fontUi: "SF Pro Text"' apps/lib/theme/Theme.qml
          grep -q 'import QtWebEngine' apps/browser/Browser.qml
          grep -q 'Search or enter website name' apps/browser/Browser.qml
          grep -q 'WebEngineProfile' apps/browser/Browser.qml
          grep -q 'Reading List' apps/browser/Browser.qml
          grep -q 'TAB GROUPS' apps/browser/Browser.qml
          grep -q 'text: "Profiles"' apps/browser/Browser.qml
          grep -q 'options: \["DuckDuckGo", "Brave", "Bing", "Google"\]' apps/browser/Browser.qml
          grep -q 'id: websitePermissionsSheet' apps/browser/Browser.qml
          grep -q 'listAllPermissions' apps/browser/Browser.qml
          grep -q 'id: tabOverview' apps/browser/Browser.qml
          grep -q 'DragHandler' apps/browser/Browser.qml
          grep -q 'text: "Find on Page…"' apps/browser/Browser.qml
          grep -q 'currentView.findText' apps/browser/Browser.qml
          grep -q 'id: tabGroupsManager' apps/browser/Browser.qml
          grep -q 'Save Tabs as Group' apps/browser/Browser.qml
          grep -q 'WebEngineProfile' apps/browser/Browser.qml
          grep -q 'BrowserBackend.attachProfile(root.profile)' apps/browser/Browser.qml
          grep -q 'text: "Privacy Report"' apps/browser/Browser.qml
          grep -q 'privacyProtection' apps/browser/model.py
          grep -q 'QWebEngineUrlRequestInterceptor' apps/browser/backend.py
          grep -q 'setUrlRequestInterceptor' apps/browser/backend.py
          grep -q 'QtWebEngineQuick.initialize' apps/browser/browser.py
          grep -q 'parse_arguments' apps/browser/browser.py
          grep -q 'profile_key' apps/browser/browser.py
          grep -q 'browser.py' apps/browser/launch.sh
          ! grep -q 'QtWidgets' apps/browser/browser.py
          test ! -e apps/browser/ui.py
          test ! -e apps/browser/qml_browser.py
          test ! -e apps/browser/WebWindow.qml
          grep -q 'hyprglass.so' distro/archiso/build.sh
          grep -q 'HyprGlass owns blur/refraction' compositor/hyprland/hyprland.conf
          ! grep -Rqs 'ShaderEffect' apps/setup
          test ! -d apps/setup/shaders
          grep -q 'org.goldengate.Software' shell/components/Prefs.qml
          bash -n distro/archiso/overlay/usr/local/bin/gg-session
          bash -n apps/software/open.sh
          ! grep -q 'ghostty' apps/settings/panes/UpdatePane.qml
          grep -q 'update-helper.py' apps/settings/panes/UpdatePane.qml
          grep -q 'ERASE:' apps/installer/helper.py
          grep -q 'rsync' apps/installer/helper.py
          ! grep -q 'archinstall' apps/installer.qml
          ! grep -qxE 'nautilus|gnome-software|gnome-control-center|gnome-clocks|gnome-text-editor|gnome-calendar|loupe|geary|fractal' distro/archiso/packages.x86_64
          ! grep -Rqs 'TextInput {' apps --exclude-dir=lib --exclude-dir=browser
          grep -q 'org.goldengate.Mail' shell/components/Prefs.qml
          grep -q 'org.goldengate.Messages' shell/components/Prefs.qml
          grep -q 'org.goldengate.Calendar' shell/components/Prefs.qml
          grep -q 'org.goldengate.Files' shell/components/Prefs.qml
          grep -q 'compgen -G "$schema_dir/\*.gschema.xml"' scripts/install.sh
          ! grep -q 'org.gnome.nautilus' themes/gsettings/90_golden-gate.gschema.override
      - name: Stage extras and new-account desktop
        run: |
          root="$(mktemp -d)"
          scripts/install.sh --extras "$root"
          test -x "$root/usr/local/bin/gg-session"
          test -x "$root/usr/local/bin/gg-web"
          test -x "$root/usr/local/bin/gg-install"
          test -x "$root/usr/local/bin/gg-software"
          test -x "$root/usr/local/bin/gg-files"
          test -x "$root/usr/local/bin/gg-intelligence"
          test -f "$root/usr/share/golden-gate/ui/intelligence/helper.py"
          test -f "$root/usr/share/applications/org.goldengate.Intelligence.desktop"
          test -x "$root/usr/local/bin/gg-lcode"
          test -x "$root/usr/local/bin/gg-pref"
          test -x "$root/usr/local/bin/gg-hyprglass-sync"
          test -x "$root/usr/local/bin/gg-apply-preferences"
          test -f "$root/usr/share/wayland-sessions/golden-gate.desktop"
          grep -q '^Exec=gg-session$' "$root/usr/share/wayland-sessions/golden-gate.desktop"
          test -d "$root/etc/skel/.config/quickshell/golden-gate"
          test -f "$root/etc/skel/.config/hypr/hyprland.conf"
          grep -q '/usr/share/golden-gate/apps' "$root/etc/skel/.config/hypr/hyprland.conf"
          test -f "$root/usr/share/applications/org.goldengate.Web.desktop"
          test -f "$root/usr/share/applications/org.goldengate.Installer.desktop"
          test -f "$root/usr/share/applications/org.goldengate.Software.desktop"
          test -f "$root/usr/share/applications/org.goldengate.Files.desktop"
          test -f "$root/usr/share/applications/org.goldengate.Calendar.desktop"
          test -f "$root/usr/share/applications/org.goldengate.Mail.desktop"
          test -f "$root/usr/share/applications/org.goldengate.Messages.desktop"
          test -f "$root/usr/share/applications/org.goldengate.Clock.desktop"
          test -f "$root/usr/share/applications/org.goldengate.TextEdit.desktop"
          test -f "$root/usr/share/applications/org.goldengate.Terminal.desktop"
          test -f "$root/usr/share/applications/org.goldengate.LCode.desktop"
          test -f "$root/usr/share/golden-gate/apps/lcode/helper.py"
          test -f "$root/usr/share/golden-gate/apps/installer.qml"
          test -f "$root/usr/share/golden-gate/apps/installer/helper.py"
          test -f "$root/usr/share/golden-gate/apps/settings/update-helper.py"
          test -f "$root/usr/share/golden-gate/ui/ProgressBar.qml"
          test -f "$root/usr/share/golden-gate/ui/TextArea.qml"
          # The shell reaches the shared UI and its one Theme only through ui/.
          test -L "$root/etc/skel/.config/quickshell/golden-gate/ui"
          test "$(readlink "$root/etc/skel/.config/quickshell/golden-gate/ui")" = "/usr/share/golden-gate/ui"
          test -f "$root/etc/skel/.config/quickshell/golden-gate/components/Glass.qml"
          grep -q 'import "../ui" as Shared' "$root/etc/skel/.config/quickshell/golden-gate/components/Glass.qml"
          test ! -e "$root/etc/skel/.config/quickshell/golden-gate/theme"
          test -d "$root/usr/share/golden-gate/ui"
          test -L "$root/usr/share/golden-gate/apps/lib"
          test "$(readlink "$root/usr/share/golden-gate/apps/lib")" = "../ui"
          test -x "$root/usr/lib/golden-gate/pref-helper.py"
          test -x "$root/usr/lib/golden-gate/hyprglass-sync.sh"
          test -x "$root/usr/lib/golden-gate/apply-preferences.sh"
          test -f "$root/usr/share/licenses/golden-gate/hyprglass/LICENSE"

          # mkarchiso uses --system, not --extras. Stage that exact path too so
          # canonical shell links cannot accidentally differ in the live image.
          system_root="$(mktemp -d)"
          scripts/install.sh --system "$system_root"
          # The shell reaches the shared UI and its one Theme only through ui/.
          test -L "$system_root/etc/skel/.config/quickshell/golden-gate/ui"
          test "$(readlink "$system_root/etc/skel/.config/quickshell/golden-gate/ui")" = "/usr/share/golden-gate/ui"
          test -f "$system_root/etc/skel/.config/quickshell/golden-gate/components/Glass.qml"
          grep -q 'import "../ui" as Shared' "$system_root/etc/skel/.config/quickshell/golden-gate/components/Glass.qml"
          test ! -e "$system_root/etc/skel/.config/quickshell/golden-gate/theme"
          test ! -e "$system_root/usr/share/applications/com.mitchellh.ghostty.desktop"
          test -f "$system_root/usr/local/share/applications/com.mitchellh.ghostty.desktop"
          grep -q '^NoDisplay=true$' "$system_root/usr/local/share/applications/com.mitchellh.ghostty.desktop"

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npx playwright install --with-deps chromium
      - name: Click through the reference shell
        run: SHOTS=out/ui npm run test:ui
      - name: Upload UI screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: out/ui
          retention-days: 3

  native-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 xvfb libx11-6 libxtst6
      - run: python -m pip install PySide6-Essentials==6.11.2
      - name: Compile native Python helpers
        run: python -m compileall -q apps tests
      - name: Guard known QML parser regressions
        run: python tests/qml-regressions.py
      - name: Parse all native QML
        run: python tests/check-qml.py
      - name: Verify installer disk discovery stays read-only
        run: python tests/installer-safety.py
      - name: Verify Settings are wired to real persistent actions
        run: python tests/settings-wiring.py
      - name: Guard the shared app component store
        run: python tests/shared-ui.py
      - name: Verify the default desktop is internally coherent
        run: python tests/default-desktop.py
      - name: Verify the default desktop is internally coherent
        run: python tests/default-desktop.py
      - name: Verify QML symbol references exist
        run: python tests/symbol-integrity.py
      - name: Smoke-test native app backends
        run: python tests/native-app-backends.py
      - name: Citron Intelligence API contracts and file safety (no API key needed)
        run: python tests/intelligence.py
      - name: Share files between two AirDrop services (LocalSend protocol)
        run: python tests/airdrop.py
      - name: Recognise nearby headphones and iPhones for the pairing card
        run: python tests/nearby.py
      - name: Install CitronOS from GitHub as a Software Update (staged root)
        run: python tests/golden-update.py
      - name: Software Update repairs an out-of-date pacman keyring
        run: python tests/update-keyring.py
      - name: Title bars with traffic lights for apps that leave theirs to the compositor
        run: python tests/titlebars.py
      - name: Window › Move & Resize tiles inside the usable area
        run: python tests/tiling.py
      - name: Files' backend (drag and drop, Trash, Recents)
        run: python tests/files-helper.py
      - name: "Mac apps: catalog, download, checksum, install, open with Darling, remove"
        run: python tests/mac-apps.py
      - name: Mac app support installs Darling's release after readying pacman
        run: python tests/darling-setup.py
      - name: Liquid Glass is set up system-wide with valid Hyprland rules
        run: python tests/liquid-glass.py
      - name: Exercise native control keyboard and pointer behavior
        run: python tests/native-controls.py
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
      - name: Test LCode projects, builds, Simulator and code editor
        run: python tests/lcode.py
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
      - name: Test app data and async request handling
        run: npm run test:logic

  browser-and-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libopengl0 libnss3 libxtst6 libxkbfile1 libasound2t64 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libsecret-tools gnome-keyring dbus
      - run: python -m pip install PySide6==6.11.2
      - name: Writing Tools selection, undo and TextEdit save regressions
        run: python tests/intelligence-ui.py
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
      - name: Validate Citron voice WebSocket contracts without microphone or network
        run: python tests/intelligence-live.py
      - name: Test account failures, preferences, and browser state
        run: python tests/setup-browser.py
      - name: Test Web startup crash recovery and safe graphics fallback
        run: python tests/browser-recovery.py
      - name: Exercise native Chromium navigation, tabs, private browsing, and shortcuts
        run: xvfb-run -a python tests/native-browser.py
        env:
          QT_QPA_PLATFORM: xcb
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
      - name: Load the shell and every app through the preview harness (no QML errors)
        run: sudo apt-get install -y librsvg2-bin libpulse0 && python tests/qml-load.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Files' Quick Look previews pictures, text and other files
        run: python tests/quicklook.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Mission Control spreads this desktop's windows; App Exposé the front app's
        run: python tests/missioncontrol.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: The screenshot toolbar draws and its keys are wired
        run: python tests/screenshot.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: The App Store's pages draw
        run: python tests/app-store.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Control Center draws the macOS 26 grid
        run: python tests/control-center.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Desktop widgets draw, edit and add
        run: python tests/desktop-widgets.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: The lock screen sleeps, wakes and unlocks
        run: python tests/lock-screen.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: The SDDM login window logs in
        run: python tests/sddm-theme.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: The menu bar has a background and Files' menus on the desktop
        run: python tests/menu-bar.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Privacy indicators show who uses the microphone, camera, screen and location
        run: python tests/privacy.py
        env:
          QT_QPA_PLATFORM: offscreen
