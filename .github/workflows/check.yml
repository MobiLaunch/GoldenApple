name: Check

on:
  push:
  pull_request:

jobs:
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild tokens and icons
        run: npm run build
      - name: Generated files are up to date
        run: git diff --exit-code
      - name: Lint shell scripts
        run: bash -n scripts/install.sh distro/archiso/build.sh distro/archiso/boot-test.sh

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npx playwright install --with-deps chromium
      - name: Click through the reference shell
        run: SHOTS=out/ui npm run test:ui
      - name: Compile and render the Liquid Glass shader
        if: always()
        run: npm run test:shader -- compositor/liquid-glass/liquid-glass.frag out/ui/liquid-glass.png
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: out/ui
