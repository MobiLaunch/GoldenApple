name: Check

on:
  push:
  pull_request:

jobs:
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock   # pathkit-wasm outlines the symbolic icons
      - name: Rebuild tokens and icons
        run: npm run build
      - name: Generated files are up to date
        run: git diff --exit-code
      - name: Lint shell scripts
        run: bash -n scripts/install.sh distro/archiso/build.sh distro/archiso/boot-test.sh design/gtk/tests/app-shots.sh

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npx playwright install --with-deps chromium
      - name: Click through the reference shell
        run: SHOTS=out/ui npm run test:ui
      - name: Compile and render the Liquid Glass shader
        if: always()
        run: npm run test:shader -- compositor/liquid-glass/liquid-glass.frag out/ui/liquid-glass.png
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: out/ui


  native-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install PySide6-Essentials==6.11.2
      - name: Parse all native QML
        run: python tests/check-qml.py
      - name: Exercise native control keyboard and pointer behavior
        run: python tests/native-controls.py
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
      - name: Test app data and async request handling
        run: npm run test:logic
