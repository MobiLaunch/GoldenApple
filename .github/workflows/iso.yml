name: Build ISO

# Runs by hand, and on pushes that change what goes into the image.
on:
  workflow_dispatch:
  push:
    paths:
      - distro/**
      - scripts/install.sh
      - .github/workflows/iso.yml

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # The image and its work tree need ~20 GB; the runner's preinstalled SDKs don't.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force >/dev/null
          df -h /

      - name: Build in an Arch Linux container
        run: |
          docker run --rm --privileged -v "$PWD:/repo" -w /repo -e GG_BUILD_AUR=1 archlinux:latest bash -euo pipefail -c '
            pacman -Syu --noconfirm --needed archiso librsvg nodejs git base-devel sudo
            distro/archiso/build.sh
          '
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: golden-gate-iso
          path: out/*.iso
          retention-days: 7
          compression-level: 0   # the ISO is already compressed

  # Boot the fresh ISO in QEMU and check the desktop starts, with and without 3D.
  # Each run uploads boot-<display>: the serial/journal log and a screenshot.
  boot-test:
    needs: iso
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        display: [std, virtio, virgl]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: golden-gate-iso
          path: out
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends qemu-system-x86 qemu-system-gui \
            qemu-system-modules-opengl xorriso socat imagemagick xvfb xauth libgl1-mesa-dri libegl-mesa0
      - name: Boot (${{ matrix.display }})
        run: distro/archiso/boot-test.sh out/*.iso ${{ matrix.display }} boot-${{ matrix.display }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-${{ matrix.display }}
          path: |
            boot-${{ matrix.display }}/serial.log
            boot-${{ matrix.display }}/screen.png
          retention-days: 7
