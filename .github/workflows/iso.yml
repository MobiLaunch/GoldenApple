name: Build ISO

# Runs by hand, and on pushes that change what goes into the image.
on:
  workflow_dispatch:
  push:
    paths:
      - distro/**
      - '!distro/archiso/boot-test.sh'   # re-test an existing ISO with the Boot test workflow instead
      - scripts/install.sh
      - scripts/stage.sh                 # the image is an install of CitronOS's packages
      - packaging/**
      - Makefile
      - compositor/**
      - '!compositor/liquid-glass/**'    # the shader isn't in the image yet (plugin pending)
      - shell/**
      - apps/**
      - themes/**
      - icons/GoldenGate/**              # the icon theme and GTK theme are installed into the image
      - design/dist/**
      - .github/workflows/iso.yml

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read            # an earlier build's manifest, to compare with
    steps:
      - uses: actions/checkout@v4

      # The image and its work tree need ~20 GB; the runner's preinstalled SDKs don't.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force >/dev/null
          df -h /

      - name: Build in an Arch Linux container
        run: |
          docker run --rm --privileged -v "$PWD:/repo" -w /repo -e GG_BUILD_AUR=1 archlinux:latest bash -euo pipefail -c '
            # The packages as of the pinned date (distro/archive-date),
            # for the build tools and the image alike (mkarchiso uses this
            # mirrorlist); -uu takes the container to those versions.
            sh distro/pin-archive.sh
            # Mirrors drop connections now and then; downloaded packages stay
            # cached, so a retry picks up where the last attempt stopped.
            for try in 1 2 3; do
              pacman -Syuu --noconfirm --needed archiso librsvg nodejs git base-devel sudo python && break
              [ "$try" = 3 ] && exit 1
              sleep $((try * 20))
            done
            distro/archiso/build.sh
          '
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: golden-gate-iso
          path: out/*.iso
          retention-days: 7
          compression-level: 0   # the ISO is already compressed

      # What the image is made of (distro/archiso/manifest.py): the pinned
      # inputs and every package with its version. Kept longer than the ISO,
      # so any two builds can be compared.
      - uses: actions/upload-artifact@v4
        with:
          name: build-manifest
          path: out/build-manifest.json
          retention-days: 90

      # Reproducible (T-2.2): a commit built before must make the same image.
      # The last successful build of this commit, if there is one, gave a
      # manifest; this one must be the same file.
      - name: The same commit makes the same image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          before=$(gh run list -R "$GITHUB_REPOSITORY" -w iso.yml -c "$GITHUB_SHA" -s success \
                     --json databaseId -q '[.[] | select(.databaseId != ${{ github.run_id }})][0].databaseId // empty')
          if [ -z "$before" ]; then
            echo "The first build of $GITHUB_SHA: nothing to compare with."
            exit 0
          fi
          if ! gh run download "$before" -R "$GITHUB_REPOSITORY" -n build-manifest -D earlier; then
            echo "Run $before's manifest has expired or it had none: nothing to compare with."
            exit 0
          fi
          if diff -u earlier/build-manifest.json out/build-manifest.json; then
            echo "The same manifest as run $before."
          else
            echo "::error::This build of $GITHUB_SHA differs from run $before's (above): the image isn't reproducible."
            exit 1
          fi

  boot-test:
    needs: iso
    permissions:
      contents: read
      actions: read            # the boot test downloads this run's ISO artifact
    uses: ./.github/workflows/boot-test.yml
    with:
      iso-run-id: ${{ github.run_id }}
