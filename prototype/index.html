<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Golden Gate Desktop</title>
  <meta name="description" content="Reference implementation of the Golden Gate desktop shell: Liquid Glass menu bar, Control Center, Dock, Files, Photos and Settings.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&family=JetBrains+Mono:wght@400;600&display=swap">

  <link rel="stylesheet" href="css/shell.css">

<body>

</html>
