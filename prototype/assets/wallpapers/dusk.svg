<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" preserveAspectRatio="xMidYMid slice">
  <!-- "Dusk": original wallpaper for Golden Gate (dark). A lone bridge tower at sunset. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1446"/>
      <stop offset=".38" stop-color="#5a2a86"/>
      <stop offset=".66" stop-color="#c2407c"/>
      <stop offset=".86" stop-color="#f07a5c"/>
      <stop offset="1" stop-color="#ffb46a"/>
    </linearGradient>
    <linearGradient id="bay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1f63"/>
      <stop offset="1" stop-color="#140c2c"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a3261f"/>
      <stop offset=".5" stop-color="#d2402c"/>
      <stop offset="1" stop-color="#7c1a18"/>
    </linearGradient>
    <filter id="b80" filterUnits="userSpaceOnUse" x="-300" y="-300" width="2520" height="1800"><feGaussianBlur stdDeviation="80"/></filter>
    <filter id="b30" filterUnits="userSpaceOnUse" x="-300" y="-300" width="2520" height="1800"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="b6" filterUnits="userSpaceOnUse" x="-300" y="-300" width="2520" height="1800"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1920" height="1200" fill="url(#sky)"/>
  <ellipse cx="1300" cy="1020" rx="700" ry="240" fill="#ffc07a" opacity=".6" filter="url(#b80)"/>
  <path d="M-100 330C500 180 1100 260 2020 120" fill="none" stroke="#ff9ac1" stroke-width="80" opacity=".25" filter="url(#b30)"/>
  <path d="M-100 560C520 420 1200 520 2020 380" fill="none" stroke="#ffb0a0" stroke-width="120" opacity=".22" filter="url(#b30)"/>
  <rect y="1010" width="1920" height="190" fill="url(#bay)"/>
  <path d="M0 1010H1920" stroke="#ffc49a" stroke-width="3" opacity=".7" filter="url(#b6)"/>
  <!-- deck + cables -->
  <path d="M-20 948H1940" stroke="#8f211c" stroke-width="16"/>
  <g fill="none" stroke="#b8322a" stroke-width="7">
    <path d="M1360 330C1100 820 700 930 -20 940"/>
    <path d="M1440 330C1620 700 1780 860 1940 900"/>
  </g>
  <g stroke="#b8322a" stroke-width="2" opacity=".75">
    <path d="M1300 470V948M1240 590V948M1170 680V948M1090 760V948M1000 820V948M900 865V948M790 895V948M680 915V948M560 928V948"/>
    <path d="M1500 460V948M1560 580V948M1630 690V948M1700 780V948M1780 850V948M1860 890V948"/>
  </g>
  <!-- tower -->
  <path d="M1350 1010V360l12-36h26l8 36v650zM1432 1010V360l8-36h26l12 36v650z" fill="url(#tower)"/>
  <path d="M1384 420h52v24h-52zM1384 560h52v26h-52zM1384 700h52v28h-52zM1384 840h52v30h-52z" fill="#8f211c"/>
  <!-- reflection -->
  <path d="M1350 1012h128v188h-128z" fill="#c2402c" opacity=".25" filter="url(#b30)"/>
</svg>
