<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" preserveAspectRatio="xMidYMid slice">
  <!-- "Tide": original abstract wallpaper for CitronOS (light). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3efe8"/>
      <stop offset=".28" stop-color="#d9e2ee"/>
      <stop offset=".55" stop-color="#7fa6e6"/>
      <stop offset="1" stop-color="#1446c9"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#5d9bff"/>
      <stop offset=".45" stop-color="#1f5fe8"/>
      <stop offset="1" stop-color="#0a2da8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd48a" stop-opacity="0"/>
      <stop offset=".4" stop-color="#ffe2a8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff4d6" stop-opacity="0"/>
    </linearGradient>
    <filter id="b60" filterUnits="userSpaceOnUse" x="-300" y="-300" width="2520" height="1800"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="b28" filterUnits="userSpaceOnUse" x="-300" y="-300" width="2520" height="1800"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="b10" filterUnits="userSpaceOnUse" x="-300" y="-300" width="2520" height="1800"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="b2" filterUnits="userSpaceOnUse" x="-300" y="-300" width="2520" height="1800"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <rect width="1920" height="1200" fill="url(#sky)"/>
  <ellipse cx="380" cy="260" rx="620" ry="340" fill="#fff6e6" opacity=".7" filter="url(#b60)"/>
  <path d="M-200 1300C150 820 620 360 2100 120V1300Z" fill="url(#sea)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M-60 1250C300 860 760 470 2000 300" stroke="#9fd0ff" stroke-width="140" opacity=".45" filter="url(#b60)"/>
    <path d="M100 1300C420 980 900 640 2050 520" stroke="#0b2c9c" stroke-width="180" opacity=".55" filter="url(#b60)"/>
    <path d="M-40 1180C330 800 780 420 2040 230" stroke="#bfe6ff" stroke-width="46" opacity=".5" filter="url(#b28)"/>
    <path d="M260 1300C560 1060 1000 780 2060 700" stroke="#6fb4ff" stroke-width="90" opacity=".45" filter="url(#b28)"/>
    <path d="M600 1300C880 1120 1260 940 2060 900" stroke="#2146d8" stroke-width="120" opacity=".6" filter="url(#b28)"/>
    <path d="M-200 1300C150 820 620 360 2100 120" stroke="url(#gold)" stroke-width="60" filter="url(#b28)"/>
    <path d="M-200 1300C150 820 620 360 2100 120" stroke="#e8f6ff" stroke-width="14" opacity=".75" filter="url(#b10)"/>
    <path d="M-200 1300C150 820 620 360 2100 120" stroke="#ffffff" stroke-width="3.5" filter="url(#b2)"/>
    <path d="M-150 1300C200 860 660 420 2100 190" stroke="#d6efff" stroke-width="2" opacity=".6" filter="url(#b2)"/>
  </g>
</svg>
