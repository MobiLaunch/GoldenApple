<svg xmlns="http://www.w3.org/2000/svg" width="300" height="420" viewBox="0 0 300 420">
  <!-- A phone, seen a little from the side: CitronOS's own drawing (the
       Nearby card and Messages' iPhone setup). Its frame, edge and buttons,
       a pill-shaped cutout, and a screen of warm overlapping arcs. -->
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8d8a85"/>
      <stop offset="0.35" stop-color="#4a4844"/>
      <stop offset="0.7" stop-color="#6e6b66"/>
      <stop offset="1" stop-color="#2e2d2b"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3936"/>
      <stop offset="0.5" stop-color="#77746e"/>
      <stop offset="1" stop-color="#2a2927"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.38" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#3a2f22"/>
      <stop offset="0.6" stop-color="#14110e"/>
      <stop offset="1" stop-color="#0b0a09"/>
    </radialGradient>
    <linearGradient id="arcA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d7a8" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#b98a52" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5b4128" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="arcB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c48e" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#3b2a1a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.3" cy="0.25" r="0.8">
      <stop offset="0" stop-color="#9a7448" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#3e2e1d" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#120e0a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="screen"><rect x="62" y="40" width="168" height="334" rx="30"/></clipPath>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <!-- Shadow on the ground -->
  <ellipse cx="150" cy="398" rx="98" ry="9" fill="#000" opacity="0.18" filter="url(#soft)"/>
  <g transform="rotate(8 150 210) skewY(-3)">
    <!-- Side edge and buttons, seen beyond the frame -->
    <rect x="66" y="28" width="184" height="358" rx="40" fill="url(#edge)"/>
    <rect x="245" y="120" width="5" height="54" rx="2.5" fill="#55524d"/>
    <rect x="49" y="96" width="5" height="22" rx="2.5" fill="#55524d"/>
    <rect x="49" y="128" width="5" height="38" rx="2.5" fill="#55524d"/>
    <rect x="49" y="174" width="5" height="38" rx="2.5" fill="#55524d"/>
    <!-- Frame and black border -->
    <rect x="52" y="30" width="188" height="354" rx="40" fill="url(#frame)"/>
    <rect x="55" y="33" width="182" height="348" rx="37" fill="#050505"/>
    <!-- The screen -->
    <g clip-path="url(#screen)">
      <rect x="62" y="40" width="168" height="334" fill="url(#glow)"/>
      <circle cx="110" cy="120" r="120" fill="url(#orb)"/>
      <circle cx="230" cy="300" r="110" fill="url(#orb)" opacity="0.8"/>
      <circle cx="120" cy="118" r="104" fill="none" stroke="url(#arcA)" stroke-width="2.4"/>
      <circle cx="232" cy="190" r="96" fill="none" stroke="url(#arcB)" stroke-width="2"/>
      <circle cx="96" cy="330" r="92" fill="none" stroke="url(#arcA)" stroke-width="2"/>
      <circle cx="210" cy="372" r="112" fill="none" stroke="url(#arcB)" stroke-width="1.8" opacity="0.9"/>
      <path d="M62 236 C 120 196, 186 214, 230 268" fill="none" stroke="#f0d3a2" stroke-opacity="0.35" stroke-width="1"/>
      <rect x="62" y="40" width="168" height="334" fill="url(#sheen)"/>
    </g>
    <!-- The cutout -->
    <rect x="124" y="50" width="44" height="13" rx="6.5" fill="#000"/>
    <circle cx="160" cy="56.5" r="3" fill="#121318"/>
    <circle cx="160" cy="56.5" r="1.4" fill="#1f2a3a"/>
  </g>
</svg>
